<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Library</h1>
        <button type="submit" class="add-book">Add Book</button>
    </header>
    <main class="library-container">
        
    </main>

    <dialog>
        <form id="book-form">
            <div>
                <label for="title">Name</label>
                <input type="text" id="title" name="title" maxlength="20" required>
            </div>
            <div>
                <label for="author">Author</label>
                <input type="text" id="author" name="author" maxlength="20" required>
            </div>
            <div>
                <label for="pages">Pages</label>
                <input type="number" id="pages" name="pages" min="1" max="3000" required>
            </div>
            <div>
                <label for="read">Read ?</label>
                <input type="checkbox" name="read" id="read">
            </div>
            <div>
                <button type="button" id="close-dialog">Cancel</button>
                <button type="submit">Add book</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
